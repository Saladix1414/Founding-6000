name: OriginX NFT Cloudflare Bundle Verification

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cloudflare-d4
    paths:
      - .github/workflows/originx-nft-cloudflare-bundle.yml
      - cloudflare/**
      - server/src/tests/oxNft*.mjs
      - wrangler.jsonc
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  verify-cloudflare-bundle:
    name: Worker bundle dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CI: "true"
      NFT_BUYER_EMAIL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run server:build
          npm run build

      - name: Verify NFT buyer security tests
        run: |
          node server/src/tests/oxNftBuyerDisabledRuntimeTest.mjs
          node server/src/tests/oxNftBuyerRouteGateTest.mjs
          node server/src/tests/oxNftBuyerWorkerGatewayTest.mjs
          node server/src/tests/oxNftBuyerWorkerBridgeTest.mjs
          node server/src/tests/oxNftBuyerDoBridgeTest.mjs
          node server/src/tests/oxNftCloudflareRuntimePreflightTest.mjs

      - name: Verify current NFT claim integration
        run: |
          node server/src/tests/oxNftBuyerClaimSqliteIntegrationTest.mjs
          node server/src/tests/oxNftBuyerClaimConcurrencyTest.mjs
          node server/src/tests/oxNftBuyerClaimHttpGatewayTest.mjs
          node server/src/tests/oxNftBuyerClaimRouteRuntimeTest.mjs

      - name: Run local Cloudflare Worker and SQLite Durable Object
        run: |
          set -euo pipefail

          LOG="$RUNNER_TEMP/originx-workerd.log"

          echo "WORKER_STARTUP_LOG_DIAGNOSTICS=ENABLED"

          npx --yes wrangler@4.152.0 dev \
            --config wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8791 \
            > "$LOG" 2>&1 &

          PID=$!

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ]; then
              echo "=== CLOUDFLARE WORKER FAILURE ==="
              echo "WORKER_EXIT_CODE=$result"

              if kill -0 "$PID" 2>/dev/null; then
                echo "WRANGLER_PROCESS=RUNNING"
              else
                echo "WRANGLER_PROCESS=STOPPED"
              fi

              echo "=== WRANGLER LAST 120 LOG LINES ==="

              if [ -f "$LOG" ]; then
                tail -n 120 "$LOG"
              else
                echo "WRANGLER_LOG_NOT_CREATED"
              fi
            fi

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            exit "$result"
          }

          trap cleanup EXIT

          node server/src/tests/oxNftCloudflareLocalRuntimeSmoke.mjs

          echo "CLOUDFLARE_LOCAL_RUNTIME=PASS"
          echo "REAL_DEPLOYMENT=NO"

      - name: Compile Worker without deploying
        run: |
          npx --yes wrangler@4.152.0 deploy \
            --config wrangler.jsonc \
            --dry-run \
            --outdir "$RUNNER_TEMP/originx-worker-bundle"

          test -d "$RUNNER_TEMP/originx-worker-bundle"

          echo "WORKER_BUNDLE_DRY_RUN=PASS"
          echo "REAL_DEPLOYMENT=NO"
          echo "REAL_EMAIL_SENT=NO"
          echo "REAL_MINT=NO"
