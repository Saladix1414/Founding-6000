name: OriginX NFT Cloudflare Bundle Verification

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cloudflare-d4
    paths:
      - .github/workflows/originx-nft-cloudflare-bundle.yml
      - cloudflare/**
      - server/src/tests/oxNft*.mjs
      - wrangler.jsonc
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  verify-cloudflare-bundle:
    name: Worker bundle dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CI: "true"
      NFT_BUYER_EMAIL_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run server:build
          npm run build

      - name: Verify NFT buyer security tests
        run: |
          node server/src/tests/oxNftBuyerDisabledRuntimeTest.mjs
          node server/src/tests/oxNftBuyerRouteGateTest.mjs
          node server/src/tests/oxNftBuyerWorkerGatewayTest.mjs
          node server/src/tests/oxNftBuyerWorkerBridgeTest.mjs
          node server/src/tests/oxNftBuyerDoBridgeTest.mjs
          node server/src/tests/oxNftCloudflareRuntimePreflightTest.mjs

      - name: Verify current NFT claim integration
        run: |
          node server/src/tests/oxNftBuyerClaimSqliteIntegrationTest.mjs
          node server/src/tests/oxNftBuyerClaimConcurrencyTest.mjs
          node server/src/tests/oxNftBuyerClaimHttpGatewayTest.mjs
          node server/src/tests/oxNftBuyerClaimRouteRuntimeTest.mjs

      - name: Run local Cloudflare Worker and SQLite Durable Object
        run: |
          set -euo pipefail

          LOG="$RUNNER_TEMP/originx-workerd.log"

          echo "WORKER_STARTUP_LOG_DIAGNOSTICS=ENABLED"

          npx --yes wrangler@4.152.0 dev \
            --config wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8791 \
            > "$LOG" 2>&1 &

          PID=$!

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ]; then
              echo "=== CLOUDFLARE WORKER FAILURE ==="
              echo "WORKER_EXIT_CODE=$result"

              if kill -0 "$PID" 2>/dev/null; then
                echo "WRANGLER_PROCESS=RUNNING"
              else
                echo "WRANGLER_PROCESS=STOPPED"
              fi

              echo "=== WRANGLER LAST 120 LOG LINES ==="

              if [ -f "$LOG" ]; then
                tail -n 120 "$LOG"
              else
                echo "WRANGLER_LOG_NOT_CREATED"
              fi
            fi

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            exit "$result"
          }

          trap cleanup EXIT

          node server/src/tests/oxNftCloudflareLocalRuntimeSmoke.mjs

          echo "CLOUDFLARE_LOCAL_RUNTIME=PASS"
          echo "REAL_DEPLOYMENT=NO"

      - name: Run isolated NFT buyer claim E2E
        run: |
          set -euo pipefail

          LOG="$RUNNER_TEMP/originx-nft-e2e-workerd.log"
          DATA="$RUNNER_TEMP/originx-nft-e2e-sqlite"

          mkdir -p "$DATA"

          echo "E2E_ISOLATED_RUNTIME=STARTING"
          echo "E2E_FIXTURE_DEPLOYMENT=NO"

          npx --yes wrangler@4.152.0 dev \
            --config server/src/tests/fixtures/nft-claim-workerd/wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8792 \
            --persist-to "$DATA" \
            > "$LOG" 2>&1 &

          PID=$!

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ]; then
              echo "=== NFT E2E RUNTIME FAILURE ==="
              echo "E2E_EXIT_CODE=$result"

              if kill -0 "$PID" 2>/dev/null; then
                echo "E2E_WRANGLER_PROCESS=RUNNING"
              else
                echo "E2E_WRANGLER_PROCESS=STOPPED"
              fi

              echo "=== E2E WRANGLER LOGS ==="

              if [ -f "$LOG" ]; then
                tail -n 160 "$LOG"
              else
                echo "E2E_WRANGLER_LOG_NOT_CREATED"
              fi
            fi

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true

            exit "$result"
          }

          trap cleanup EXIT

          node server/src/tests/oxNftClaimWorkerdE2eTest.mjs

          echo "NFT_CLOUDFLARE_WORKER_DO_E2E=PASS"
          echo "PRODUCTION_FLAGS_UNCHANGED=YES"
          echo "REAL_PAYMENT=NO"
          echo "REAL_EMAIL=NO"
          echo "REAL_MINT=NO"

      - name: Run isolated NFT wallet signature E2E
        run: |
          set -euo pipefail

          LOG="$RUNNER_TEMP/originx-wallet-e2e-workerd.log"
          DATA="$RUNNER_TEMP/originx-wallet-e2e-sqlite"

          mkdir -p "$DATA"

          echo "WALLET_E2E_ISOLATED_RUNTIME=STARTING"
          echo "WALLET_E2E_DEPLOYMENT=NO"

          npx --yes wrangler@4.152.0 dev \
            --config server/src/tests/fixtures/nft-claim-workerd/wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8793 \
            --persist-to "$DATA" \
            > "$LOG" 2>&1 &

          PID=$!

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ]; then
              echo "=== NFT WALLET E2E FAILURE ==="
              echo "WALLET_E2E_EXIT_CODE=$result"

              if kill -0 "$PID" 2>/dev/null; then
                echo "WALLET_WORKER_PROCESS=RUNNING"
              else
                echo "WALLET_WORKER_PROCESS=STOPPED"
              fi

              echo "=== WALLET WORKER LOGS ==="

              if [ -f "$LOG" ]; then
                tail -n 160 "$LOG"
              else
                echo "WALLET_WORKER_LOG_NOT_CREATED"
              fi
            fi

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true

            exit "$result"
          }

          trap cleanup EXIT

          node server/src/tests/oxNftWalletWorkerdE2eTest.mjs

          echo "OX_NFT_WALLET_WORKER_DO_E2E=PASS"
          echo "EMAIL_MEMBERSHIP_BINDING=VERIFIED"
          echo "ECDSA_SIGNATURE=VERIFIED"
          echo "REPLAY_PROTECTION=VERIFIED"
          echo "REAL_MINT=NO"
          echo "REAL_FUNDS_MOVED=NO"

      - name: Run isolated NFT wallet binding E2E
        run: |
          set -euo pipefail

          LOG="$RUNNER_TEMP/originx-wallet-binding-e2e.log"
          DATA="$RUNNER_TEMP/originx-wallet-binding-sqlite"

          mkdir -p "$DATA"

          echo "WALLET_BINDING_E2E=STARTING"
          echo "WALLET_BINDING_DEPLOYMENT=NO"

          npx --yes wrangler@4.152.0 dev \
            --config server/src/tests/fixtures/nft-claim-workerd/wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8794 \
            --persist-to "$DATA" \
            > "$LOG" 2>&1 &

          PID=$!

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ]; then
              echo "=== WALLET BINDING E2E FAILURE ==="
              echo "WALLET_BINDING_EXIT_CODE=$result"

              if kill -0 "$PID" 2>/dev/null; then
                echo "WALLET_BINDING_WORKER=RUNNING"
              else
                echo "WALLET_BINDING_WORKER=STOPPED"
              fi

              if [ -f "$LOG" ]; then
                tail -n 160 "$LOG"
              else
                echo "WALLET_BINDING_LOG_MISSING"
              fi
            fi

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true

            exit "$result"
          }

          trap cleanup EXIT

          node server/src/tests/oxNftWalletBindingWorkerdE2eTest.mjs

          echo "OX_NFT_5J_3_WORKER_E2E=PASS"
          echo "BINDING_PERSISTENCE=VERIFIED"
          echo "BINDING_DUPLICATES=BLOCKED"
          echo "ORIGINAL_SUBSCRIBER_EMAIL=PRESERVED"
          echo "MINT_AUTHORITY=NONE"
          echo "PRODUCTION_DEPLOYMENT=NO"
          echo "REAL_MINT=NO"

      - name: Run isolated NFT delivery preflight E2E
        run: |
          set -euo pipefail

          LOG="$RUNNER_TEMP/originx-preflight-e2e.log"
          DATA="$RUNNER_TEMP/originx-preflight-sqlite"

          mkdir -p "$DATA"

          echo "DELIVERY_PREFLIGHT_E2E=STARTING"
          echo "DELIVERY_PREFLIGHT_DEPLOYMENT=NO"

          node server/src/tests/oxNftWalletDeliveryPreflightTest.mjs

          npx --yes wrangler@4.152.0 dev \
            --config server/src/tests/fixtures/nft-claim-workerd/wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8795 \
            --persist-to "$DATA" \
            > "$LOG" 2>&1 &

          PID=$!

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ]; then
              echo "=== DELIVERY PREFLIGHT E2E FAILURE ==="
              echo "PREFLIGHT_EXIT_CODE=$result"

              if kill -0 "$PID" 2>/dev/null; then
                echo "PREFLIGHT_WORKER=RUNNING"
              else
                echo "PREFLIGHT_WORKER=STOPPED"
              fi

              echo "=== WORKER LAST 160 LOG LINES ==="

              if [ -f "$LOG" ]; then
                tail -n 160 "$LOG"
              else
                echo "PREFLIGHT_LOG_NOT_CREATED"
              fi
            fi

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true

            exit "$result"
          }

          trap cleanup EXIT

          node server/src/tests/oxNftDeliveryPreflightWorkerdE2eTest.mjs

          echo "OX_NFT_5J_4_WORKER_E2E=PASS"
          echo "REGISTERED_EMAIL=VERIFIED"
          echo "WALLET_BINDING=VERIFIED"
          echo "DELIVERY_PREFLIGHT=READ_ONLY"
          echo "MINT_AUTHORITY=NONE"
          echo "REAL_DEPLOYMENT=NO"
          echo "REAL_MINT=NO"

      - name: Run isolated NFT mint readiness E2E
        run: |
          set -euo pipefail

          LOG="$RUNNER_TEMP/originx-readiness-e2e.log"
          DATA="$RUNNER_TEMP/originx-readiness-sqlite"

          mkdir -p "$DATA"

          npx --yes wrangler@4.152.0 dev \
            --config server/src/tests/fixtures/nft-claim-workerd/wrangler.jsonc \
            --local \
            --ip 127.0.0.1 \
            --port 8796 \
            --persist-to "$DATA" \
            > "$LOG" 2>&1 &

          PID=$!

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ]; then
              echo "=== NFT READINESS E2E FAILURE ==="
              if [ -f "$LOG" ]; then
                tail -n 160 "$LOG"
              fi
            fi

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            exit "$result"
          }

          trap cleanup EXIT

          node server/src/tests/oxNftMintReadinessTransitionTest.mjs
          node server/src/tests/oxNftMintReadinessWorkerdE2eTest.mjs

          echo "OX_NFT_5J_5_WORKER_E2E=PASS"
          echo "SQLITE_ATOMIC_READINESS=VERIFIED"
          echo "READINESS_AUDIT=PERSISTED"
          echo "MINT_AUTHORITY=NONE"
          echo "REAL_DEPLOYMENT=NO"
          echo "REAL_MINT=NO"

      - name: Compile Worker without deploying
        run: |
          npx --yes wrangler@4.152.0 deploy \
            --config wrangler.jsonc \
            --dry-run \
            --outdir "$RUNNER_TEMP/originx-worker-bundle"

          test -d "$RUNNER_TEMP/originx-worker-bundle"

          echo "WORKER_BUNDLE_DRY_RUN=PASS"
          echo "REAL_DEPLOYMENT=NO"
          echo "REAL_EMAIL_SENT=NO"
          echo "REAL_MINT=NO"
